<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sᴍᴏᴋᴇ•X — STA 112 CBT</title>

<style>
:root{
  --bg:#070a10;
  --panel:#101620;
  --panel2:#151c28;
  --line:#263143;
  --text:#f4f7fb;
  --muted:#8e9aae;
  --blue:#4d8dff;
  --green:#18c985;
  --red:#ff5364;
  --gold:#ffc857;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,#142443 0,#070a10 48%);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button{
  font:inherit;
}

button:active{
  transform:scale(.98);
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,10,16,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.topin{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-weight:900;
  font-size:17px;
}

.brand span{
  color:var(--blue);
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.timer{
  min-width:78px;
  padding:9px 11px;
  border-radius:11px;
  background:#111a29;
  border:1px solid #2a3b55;
  color:#9fc2ff;
  font-weight:900;
  text-align:center;
}

.timer.danger{
  color:#ff7180;
  border-color:#71313a;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:14px 12px 110px;
}

.screen{
  min-height:calc(100vh - 70px);
  display:grid;
  place-items:center;
}

.hero{
  width:100%;
  max-width:520px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px;
  text-align:center;
  box-shadow:0 20px 60px #0008;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  color:var(--muted);
  line-height:1.55;
}

.hero button{
  margin-top:8px;
  background:var(--blue);
  color:#fff;
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-weight:900;
  cursor:pointer;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.progressbox{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

.progressrow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.track{
  height:6px;
  background:#1b2330;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#3f7cff,#64a1ff);
  transition:.2s;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 14px 40px #0005;
}

.qnum{
  color:#7faeff;
  font-size:12px;
  font-weight:900;
  margin-bottom:10px;
}

.qtext{
  font-size:17px;
  line-height:1.55;
  font-weight:700;
  margin-bottom:17px;
}

.option{
  width:100%;
  display:flex;
  align-items:flex-start;
  gap:10px;
  text-align:left;
  background:var(--panel2);
  color:var(--text);
  border:1px solid #2b3545;
  border-radius:13px;
  padding:13px 12px;
  margin:7px 0;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  border-color:#5279b8;
}

.option.selected{
  border-color:var(--blue);
  background:#142746;
}

.option.correct{
  border-color:var(--green);
  background:#103a2d;
}

.option.wrong{
  border-color:var(--red);
  background:#3a151c;
}

.letter{
  flex:0 0 27px;
  width:27px;
  height:27px;
  border-radius:8px;
  background:#202a39;
  display:grid;
  place-items:center;
  font-weight:900;
  color:#aab8cc;
  font-size:12px;
}

.selected .letter{
  background:var(--blue);
  color:#fff;
}

.correct .letter{
  background:var(--green);
  color:#fff;
}

.wrong .letter{
  background:var(--red);
  color:#fff;
}

.nav{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.nav button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#121a26;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.nav .primary{
  background:var(--blue);
  border-color:var(--blue);
}

.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
  margin-top:12px;
}

.jump{
  padding:8px 0;
  border-radius:8px;
  background:#121a25;
  color:#9aa7b9;
  border:1px solid #242e3e;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.jump.done{
  background:#123d31;
  color:#54e0ad;
  border-color:#1c7258;
}

.jump.current{
  outline:2px solid var(--blue);
  color:#fff;
}

.jump.unanswered{
  color:#9aa7b9;
}

.resultHero{
  max-width:760px;
  width:100%;
}

.score{
  font-size:52px;
  font-weight:1000;
  color:#68a0ff;
  margin:8px 0;
}

.review{
  margin-top:18px;
  text-align:left;
}

.reviewTitle{
  margin-bottom:10px;
}

.reviewitem{
  background:#111824;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  margin:9px 0;
}

.reviewitem.correctItem{
  border-color:#1b684f;
}

.reviewitem.wrongItem{
  border-color:#73333c;
}

.reviewQ{
  font-weight:900;
  margin-bottom:8px;
}

.answerLine{
  font-size:13px;
  color:var(--muted);
  margin-top:5px;
}

.explanation{
  margin-top:10px;
  padding:10px;
  border-left:3px solid var(--blue);
  background:#0c1119;
  color:#c8d1df;
  font-size:13px;
  line-height:1.55;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  margin-bottom:8px;
}

.badge.correctBadge{
  background:#123d31;
  color:#54e0ad;
}

.badge.wrongBadge{
  background:#3d171e;
  color:#ff7886;
}

.warning{
  padding:10px;
  background:#332a12;
  border:1px solid #5d4c20;
  border-radius:10px;
  color:#ffd86b;
  font-size:12px;
  margin-top:12px;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){

  .top{
    padding:10px;
  }

  .brand{
    font-size:15px;
  }

  .meta{
    font-size:10px;
  }

  .timer{
    min-width:72px;
    padding:8px;
  }

  .qtext{
    font-size:16px;
  }

  .card{
    padding:15px;
  }

  .grid{
    grid-template-columns:repeat(8,1fr);
  }

  .hero{
    padding:22px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="topin">

    <div>
      <div class="brand">
        Sᴍᴏᴋᴇ•X <span>CBT</span>
      </div>

      <div class="meta">
        STA 112 • Data Analysis • Past Questions
      </div>
    </div>

    <div class="timer" id="timer">
      60:00
    </div>

  </div>
</header>


<!-- START SCREEN -->
<section id="startScreen" class="wrap screen">

  <div class="hero">

    <h1>STA 112 CBT</h1>

    <p>
      Practice with the Type A past-question bank.
      The system randomly selects <b>35 questions</b> for every attempt.
    </p>

    <p class="small">
      35 Questions • 60 Minutes • Random Selection
    </p>

    <button onclick="startExam()">
      START RANDOM 35
    </button>

  </div>

</section>


<!-- EXAM -->
<main id="examScreen" class="wrap hidden">

  <div class="progressbox">

    <div class="progressrow">
      <span id="counter">
        Question 1 of 35
      </span>

      <span id="answered">
        0 answered
      </span>
    </div>

    <div class="track">
      <div class="fill" id="fill"></div>
    </div>

  </div>


  <div class="card">

    <div class="qnum" id="qnum">
      QUESTION 1
    </div>

    <div class="qtext" id="qtext"></div>

    <div id="options"></div>

  </div>


  <div class="nav">

    <button onclick="previousQuestion()">
      ← Previous
    </button>

    <button
      class="primary"
      id="nextButton"
      onclick="nextQuestion()">
      Next →
    </button>

  </div>


  <div class="grid" id="questionGrid"></div>

</main>


<!-- RESULT -->
<section id="resultScreen" class="wrap screen hidden">

  <div class="hero resultHero">

    <div class="small">
      EXAM COMPLETED
    </div>

    <div class="score" id="score">
      0%
    </div>

    <h2 id="scoreText">
      0 / 35
    </h2>

    <p id="resultStats"></p>

    <button onclick="location.reload()">
      TAKE ANOTHER RANDOM TEST
    </button>

    <div id="review" class="review"></div>

  </div>

</section>


<script>

/* =========================================================
   STA 112 TYPE A QUESTION BANK
   70 QUESTIONS
   ========================================================= */

const questionBank = [

{
q:`A random sample of 28 FUPRE students read a mean of 12 books with a standard deviation of 2.14 books in a month. At 0.05 level of significance, determine the calculated value of the statistic for testing the claim that the mean number of books read per month is less than 2.`,
o:[`-0.8`,`0.80`,`1.98`,`-1.98`],
a:`D`,
e:`For this test, use the sample mean, hypothesized mean, sample standard deviation and sample size in the test-statistic formula. The supplied solution gives -1.98, option D.`
},

{
q:`Using the information in Question 1, what is the table value for this test?`,
o:[`1.96`,`1.65`,`2.252`,`1.703`],
a:`D`,
e:`Because the sample is small and the test is one-tailed, the supplied solution uses the t-distribution with 27 degrees of freedom. The table value is 1.703.`
},

{
q:`Using the information in Questions 1–2, what is the decision for the hypothesis?`,
o:[`Reserve judgment`,`Accept H₀`,`Cannot reject H₀`,`Reject H₀`],
a:`B`,
e:`The supplied solution compares the calculated statistic with the tabulated value and accepts H₀.`
},

{
q:`The variance of a set of data is 40. What is the variance if each element of the data is divided by 2?`,
o:[`40`,`10`,`160`,`80`],
a:`B`,
e:`Dividing every observation by 2 divides the variance by 2². Therefore 40/4 = 10.`
},

{
q:`The variance of a set of data is 30. What is the variance if 2 is subtracted from each element of the data?`,
o:[`60`,`30`,`90`,`120`],
a:`B`,
e:`Adding or subtracting a constant does not change variance. Therefore the variance remains 30.`
},

{
q:`A sample of 30 roses has a mean price of $48.33 and standard deviation 6.07. At α = 1%, test the claim that the mean price is higher than 45. What is the calculated test statistic?`,
o:[`3.33`,`3.0`,`1.11`,`2.54`],
a:`B`,
e:`The supplied calculation gives approximately 3.005, which corresponds to option B, 3.0.`
},

{
q:`Using Question 6, what is the table value for the test?`,
o:[`1.96`,`2.33`,`1.64`,`2.58`],
a:`B`,
e:`This is a one-tailed test at the 1% significance level. The supplied solution gives 2.33.`
},

{
q:`Using Questions 6–7, what is the decision for the hypothesis?`,
o:[`Reserve judgment`,`Reject H₀`,`Cannot reject H₀`,`Accept H₀`],
a:`B`,
e:`The calculated value is larger than the critical value, so the supplied solution rejects H₀.`
},

{
q:`The volume of wine filled by a bottling machine is normally distributed with σ = 5 cl. In a sample of 16 bottles, x̄ = 74.3 cl. Construct a 95% confidence interval for μ.`,
o:[`(71.64, 76.96)`,`(71.85, 76.75)`,`(-71.64, -76.96)`,`(-71.85, -76.75)`],
a:`A`,
e:`The supplied worked solution constructs the confidence interval around 74.3 and obtains (71.64, 76.96).`
},

{
q:`The 95% confidence interval for the mean, with n = 34, x̄ = 3.54 and s = 0.13, is:`,
o:[`(3.50, 3.58)`,`(-3.50, 3.58)`,`(3.40, 3.50)`,`(-3.40, 3.50)`],
a:`A`,
e:`The supplied solution gives 3.54 ± the appropriate margin of error, producing (3.50, 3.58).`
},

{
q:`If x̄₁ = 3, s₁ = 0.9, n₁ = 50, x̄₂ = 3.5, s₂ = 1.2, n₂ = 50, the value of the test statistic for testing the significant difference between the two sample means is:`,
o:[`1.96`,`2.36`,`-2.36`,`-1.107`],
a:`C`,
e:`The supplied calculation gives approximately -2.357, corresponding to option C.`
},

{
q:`What is the table value for the test in Question 11, using α = 1%?`,
o:[`1.96`,`1.64`,`2.58`,`2.24`],
a:`C`,
e:`For a two-tailed 1% test, the supplied solution uses ±2.58 as the critical values.`
},

{
q:`What is the decision for the hypothesis in Questions 11–12, using α = 1%?`,
o:[`Reserve judgment`,`Reject H₀`,`Cannot reject H₀`,`Accept H₀`],
a:`D`,
e:`The supplied solution states that the calculated statistic falls between the critical values, so H₀ is accepted.`
},

{
q:`A company claims that its meat pie takes 10 minutes to make. To test if the actual time taken is more than the company claim, a sample was selected and hypothesis testing carried out. What type of test is this?`,
o:[`Type I`,`Type II`,`Two-tailed`,`One-tailed`],
a:`D`,
e:`The claim asks whether the value is greater than the stated value, so the supplied answer is a one-tailed test.`
},

{
q:`For testing a hypothesis using normal distribution, H₀ is rejected if:`,
o:[`P-value ≤ α`,`P-value ≥ α`,`P-value > α`,`P-value < α`],
a:`D`,
e:`The supplied answer key gives P-value < α as the rejection condition.`
},

{
q:`A random sample of 34 Shoprite customers spent a mean amount of 4.43 and standard deviation 3.23. Test the claim that the mean amount spent is less than 5 at α = 0.05. What is the calculated test statistic?`,
o:[`1.03`,`1.11`,`-1.03`,`-1.11`],
a:`C`,
e:`Using the supplied values in the test-statistic formula gives approximately -1.03, option C.`
},

{
q:`Using Question 16, what is the table value for this test?`,
o:[`1.96`,`2.33`,`1.65`,`2.58`],
a:`C`,
e:`This is a one-tailed test at α = 0.05. The supplied table value is 1.65.`
},

{
q:`Using Questions 16–17, what is the decision for the hypothesis?`,
o:[`Reserve judgment`,`Reject H₀`,`Cannot reject H₀`,`Accept H₀`],
a:`C`,
e:`The calculated statistic does not cross the supplied critical value, so the answer key gives Cannot reject H₀.`
},

{
q:`Acceptance of the null hypothesis when it is false leads to ______ error.`,
o:[`Type I`,`Type II`,`One-tailed`,`Two-tailed`],
a:`B`,
e:`A Type II error occurs when a false null hypothesis is not rejected.`
},

{
q:`The first step in hypothesis testing is the determination of the ______.`,
o:[`Critical region`,`H₀ and H₁`,`Calculated value of the test statistic`,`Decision`],
a:`B`,
e:`The supplied solution identifies formulation of H₀ and H₁ as the first step.`
},

{
q:`From the gender/colour table in the question paper, how many males should we have expected to prefer light colour?`,
o:[`16.6`,`27.67`,`1.66`,`13.83`],
a:`A`,
e:`Expected frequency = row total × column total / grand total. For male-light: 83 × 30 / 150 = 16.6.`
},

{
q:`From the same table, how many females should we have expected to prefer bright colour?`,
o:[`22.33`,`27.67`,`16.6`,`13.40`],
a:`A`,
e:`Expected frequency = 67 × 50 / 150 = 22.33, which is option A.`
},

{
q:`What is the calculated value for testing the dependent of colour on gender?`,
o:[`24.007`,`27.672`,`16.642`,`23.405`],
a:`D`,
e:`The supplied worked calculation gives approximately 22.6485, and the answer key marks option D.`
},

{
q:`What is the table value for Question 23?`,
o:[`7.815`,`2.58`,`2.131`,`1.96`],
a:`A`,
e:`For the chi-square test with the stated degrees of freedom and α = 0.05, the supplied critical value is 7.815.`
},

{
q:`What is the decision for the hypothesis in Questions 23–24?`,
o:[`Reject H₀`,`Accept H₀`,`Cannot reject H₀`,`Reserve judgment`],
a:`A`,
e:`The supplied solution compares the calculated chi-square value with the table value and rejects H₀.`
},

{
q:`If n = 148, x̄ = -7.1, σ = 1.2, a 95% confidence interval for μ is:`,
o:[`(6.91, 7.29)`,`(-7.29, -6.91)`,`(-7.29, 6.91)`,`(-6.91, -7.29)`],
a:`D`,
e:`Using the supplied confidence-interval calculation gives approximately -7.29 to -6.91, marked D in the source.`
},

{
q:`If n = 16, x̄ = -7.1, S = 1.1, a 95% confidence interval for μ is:`,
o:[`(6.51, 7.49)`,`(-7.69, -6.51)`,`(-6.51, 7.49)`,`(6.69, 7.51)`],
a:`B`,
e:`Because the sample is small, the supplied solution uses the t critical value and obtains (-7.69, -6.51).`
},

{
q:`If x̄₁ = 8.5, s₁ = 2.3, n₁ = 100, x̄₂ = 7.5, s₂ = 2.8, n₂ = 110, the value of the test statistic for the significant difference between the two sample means is:`,
o:[`1.96`,`-2.84`,`2.84`,`2.58`],
a:`C`,
e:`The supplied calculation gives approximately 2.84, corresponding to option C.`
},

{
q:`What is the decision for Question 28 using α = 5%?`,
o:[`Accept H₀`,`Cannot reject H₀`,`Reject H₀`,`Reserve judgment`],
a:`C`,
e:`The calculated statistic exceeds the supplied 5% critical value, so H₀ is rejected.`
},

{
q:`If Var(X) = 2, then Var(X + C), where C = 2, is:`,
o:[`6`,`4`,`8`,`2`],
a:`D`,
e:`Adding a constant does not change variance. Therefore Var(X + 2) = Var(X) = 2.`
},

{
q:`A 95% confidence interval reported for parameter μ is 1.6 to 7.8, based on 16 observations constructed using the t-distribution. What is the table value of the t-distribution?`,
o:[`2.131`,`1.64`,`2.58`,`2.24`],
a:`A`,
e:`With 16 observations, the supplied solution uses 15 degrees of freedom and gives t = 2.131.`
},

{
q:`Using Question 31, what is the value of the standard error of mean S.E.(x̄)?`,
o:[`1.45`,`2.131`,`4.18`,`1.64`],
a:`A`,
e:`The supplied solution uses the width of the confidence interval and the t critical value to obtain approximately 1.45.`
},

{
q:`Using Question 31, what is the mean of the unknown data set?`,
o:[`4.70`,`1.60`,`1.50`,`2.54`],
a:`A`,
e:`The supplied answer key gives 4.70 for the mean of the unknown data set.`
},

{
q:`If α = 2.5%, what is the table value for a two-tailed test using normal distribution?`,
o:[`1.96`,`1.64`,`2.58`,`2.24`],
a:`D`,
e:`For the stated two-tailed significance level, the supplied answer is 2.24.`
},

{
q:`The critical region is the region for:`,
o:[`Acceptance of H₀`,`Acceptance of H₁`,`Rejection of H₁`,`Rejection of H₀`],
a:`D`,
e:`The critical region contains values of the test statistic for which H₀ is rejected.`
},

{
q:`The use of sample for taking decision about the population is referred to as ______ statistic.`,
o:[`Descriptive`,`Estimation`,`Sample`,`Inferential`],
a:`D`,
e:`Inferential statistics use sample information to make conclusions about a population.`
},

{
q:`Tabular, graphical and numerical methods used to summarize a data set are called ______ statistics.`,
o:[`Data presentation`,`Inferential`,`Descriptive`,`Bar chart`],
a:`C`,
e:`Descriptive statistics summarize and present data using numerical, graphical and tabular methods.`
},

{
q:`In measuring sample, we normally summarize the sample ______ to be able to generalize the population.`,
o:[`Variable`,`Parameter`,`Statistic`,`Survey`],
a:`C`,
e:`A statistic summarizes sample information and can be used when making inferences about the population.`
},

{
q:`When equal interval is used in measuring population or sample, it is better to use ______.`,
o:[`Ordinal scale`,`Ratio scale`,`Nominal scale`,`Interval scale`],
a:`D`,
e:`An interval scale has equal intervals between successive values.`
},

{
q:`If Var(X) = 4, then Var(X − C), where C = 2, is:`,
o:[`6`,`4`,`2`,`8`],
a:`B`,
e:`Subtracting a constant does not change variance, so the answer remains 4.`
},

{
q:`Calculate x if the mean of 30, (x + 5), 12, 40, and 10 is (x + 1).`,
o:[`25`,`23`,`20`,`22`],
a:`C`,
e:`Set the sum of the five values divided by 5 equal to x + 1 and solve the resulting equation. The supplied answer is 23, option C.`
},

{
q:`______ is a good example of a sampling frame.`,
o:[`Voter’s card`,`Voter’s register`,`Class attendance`,`Employee’s name`],
a:`B`,
e:`A sampling frame is a list/register from which members of the population can be selected.`
},

{
q:`Why is sample preferred to population in most statistical enquiry?`,
o:[`Biased`,`Statistic`,`Unbiased`,`Parameter`],
a:`B`,
e:`The supplied answer key marks Statistic, option B.`
},

{
q:`Select a sample of 5 members from a population consisting of 20 members. Given that the first number selected is 3. Find the mean of the sample using systematic random sampling.`,
o:[`11`,`3`,`7`,`19`],
a:`A`,
e:`The supplied systematic sample is 3, 7, 11, 15 and 19. Their mean is 11.`
},

{
q:`Which of the following is a quasi-homogeneous random sampling?`,
o:[`Systematic random sampling`,`Simple random sampling`,`Stratified random sampling`,`Cluster sampling`],
a:`D`,
e:`The supplied answer key marks Cluster sampling, option D.`
},

{
q:`______ is a sampling method drawn from different groups from a given p
